name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver part to increment (auto reads the Conventional Commits since the last tag)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-test.txt
      - run: pytest

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - run: node scripts/lint-commits.mjs ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  # Derives the next version from the Conventional Commits since the last tag, bumps the manifest version,
  # tags vX.Y.Z and creates the GitHub release (HACS installs from release tags).
  release:
    name: Version and tag
    needs: [test, hacs, hassfest]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.released == 'true' && format('v{0}', steps.next.outputs.version) || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: next
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/next-version.mjs "$BUMP" | tee next.txt
          bump=$(sed -n 's/^bump=//p' next.txt); version=$(sed -n 's/^version=//p' next.txt); rm next.txt
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "$bump" = none ]; then
            echo "No fix, feat or breaking commits since the last tag: nothing to release."
            echo "released=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then
            echo "::error::tag v${version} already exists"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$bump" != initial ]; then
            node scripts/set-version.mjs "$version"
            git commit -am "chore(release): v${version}"
          fi
          git tag -a "v${version}" -m "v${version}"
          git push --atomic origin HEAD:main "v${version}"
          gh release create "v${version}" --title "v${version}" --generate-notes
          echo "released=true" >> "$GITHUB_OUTPUT"

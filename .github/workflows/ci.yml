name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements-test.txt
      - run: pytest

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - run: node scripts/lint-commits.mjs ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  # semantic-release: versions from the Conventional Commits, bumps the manifest, tags vX.Y.Z and creates
  # the GitHub release (HACS installs from release tags).
  release:
    name: Version and tag
    # Branch protection on main must allow the GITHUB_TOKEN to push the release commit.
    needs: [test, hacs, hassfest]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the release commit and tag, create the GitHub release
      issues: write # comment on released issues
      pull-requests: write # comment on released pull requests
    outputs:
      tag: ${{ steps.release.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the commit history and tags decide the version
          persist-credentials: false # semantic-release authenticates with GITHUB_TOKEN itself
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # Reads the Conventional Commits since the last tag; if any warrants it, bumps the version files
      # (release.config.mjs), commits, tags vX.Y.Z and creates the GitHub release.
      - id: release
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            conventional-changelog-conventionalcommits@8
            @semantic-release/exec@7
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ github.token }}

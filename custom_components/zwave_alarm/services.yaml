arm:
  target:
    entity:
      integration: zwave_alarm
      domain: alarm_control_panel
  fields:
    mode:
      required: true
      example: armed_away
      selector:
        select:
          options:
            - armed_home
            - armed_away
          translation_key: arm_mode
    bypass:
      required: false
      example: "[3f2a..., 91bc...]"
      selector:
        object:
    source:
      required: false
      example: app
      selector:
        select:
          options:
            - app
            - keypad
            - lock
            - schedule
            - alexa
          translation_key: arm_source
panic:
  target:
    entity:
      integration: zwave_alarm
      domain: alarm_control_panel
  fields:
    type:
      required: true
      example: panic
      selector:
        select:
          options:
            - panic
            - fire
            - medical
            - sos
          translation_key: panic_type
    service:
      required: false
      example: police
      selector:
        select:
          options:
            - police
            - fire
            - medical
          translation_key: panic_service
silence:
  target:
    entity:
      integration: zwave_alarm
      domain: alarm_control_panel
set_siren:
  target:
    entity:
      integration: zwave_alarm
      domain: alarm_control_panel
  fields:
    node_id:
      required: true
      example: 14
      selector:
        number:
          min: 1
          mode: box
    kind:
      required: true
      example: outdoor
      selector:
        select:
          options:
            - base
            - dome
            - outdoor
          translation_key: siren_kind
    name:
      required: false
      example: Garden siren
      selector:
        text:
    duration:
      required: false
      example: 180
      selector:
        number:
          min: 60
          max: 600
          unit_of_measurement: s
          mode: box
remove_siren:
  target:
    entity:
      integration: zwave_alarm
      domain: alarm_control_panel
  fields:
    node_id:
      required: true
      example: 14
      selector:
        number:
          min: 1
          mode: box
